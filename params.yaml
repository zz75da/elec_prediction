# =============================================================================
# elec_prediction — Experiment Parameters
# =============================================================================
# Edit this file to run a new experiment. train-api reads it at training time
# and MLflow logs every value automatically (same pattern as rakuten_mlops_services).
# =============================================================================

default_country: france   # used by /train, /predict, /countries when no country is specified

data:
  countries:
    france:
      label: France
      raw_conso_path: data/raw/france/consommation_mensuelle.csv   # Mois, Consommation (GWh) — RTE open data
      raw_dju_path: data/raw/france/dju_mensuel.csv                # Mois, DJU — 8-region national average
      processed_path: data/processed/france/conso_corrigee.csv
      test_year: 2019         # held-out year for backtesting (matches notebook's a-posteriori analysis)
    usa:
      label: "United States"
      raw_conso_path: data/raw/usa/consommation_mensuelle.csv      # EIA API v2 (retail-sales, monthly)
      raw_dju_path: data/raw/usa/dju_mensuel.csv                   # Open-Meteo daily temps -> monthly HDD
      processed_path: data/processed/usa/conso_corrigee.csv
      test_year: 2023          # synced range: 2015-01 to 2024-12
    germany:
      label: Germany
      raw_conso_path: data/raw/germany/consommation_mensuelle.csv  # SMARD (Bundesnetzagentur), no auth
      raw_dju_path: data/raw/germany/dju_mensuel.csv
      processed_path: data/processed/germany/conso_corrigee.csv
      test_year: 2023          # synced range: 2019-01 to 2024-12
    austria:
      label: Austria
      raw_conso_path: data/raw/austria/consommation_mensuelle.csv  # SMARD (region=AT), no auth
      raw_dju_path: data/raw/austria/dju_mensuel.csv
      processed_path: data/processed/austria/conso_corrigee.csv
      test_year: 2023          # synced range: 2015-01 to 2024-12
    luxembourg:
      label: Luxembourg
      raw_conso_path: data/raw/luxembourg/consommation_mensuelle.csv  # SMARD (region=LU), no auth
      raw_dju_path: data/raw/luxembourg/dju_mensuel.csv
      processed_path: data/processed/luxembourg/conso_corrigee.csv
      test_year: 2023          # synced range: 2015-01 to 2024-12
    uk:
      label: "United Kingdom"
      raw_conso_path: data/raw/uk/consommation_mensuelle.csv       # NESO historic demand data (half-hourly, aggregated), no auth
      raw_dju_path: data/raw/uk/dju_mensuel.csv
      processed_path: data/processed/uk/conso_corrigee.csv
      test_year: 2023          # synced range: 2015-01 to 2024-12
    finland:
      label: Finland
      raw_conso_path: data/raw/finland/consommation_mensuelle.csv  # Fingrid dataset 124 (15-min, aggregated)
      raw_dju_path: data/raw/finland/dju_mensuel.csv
      processed_path: data/processed/finland/conso_corrigee.csv
      test_year: 2023          # synced range: 2015-01 to 2024-12

preprocess:
  # OLS: Consommation ~ const + DJU  (notebook cells 25-38)
  # Conso_correction = Consommation - coef_DJU * DJU
  seasonal_periods: 12       # months per year — used by seasonal_decompose, Holt-Winters and SARIMA

model_holt_winters:
  trend: add
  seasonal: add

model_sarima:
  order: [1, 1, 1]           # (p, d, q) — selected in notebook after ACF/PACF + Ljung-Box diagnostics
  seasonal_order: [1, 1, 1, 12]  # (P, D, Q, s)
  log_transform: true        # fit on log(Conso_correction), exponentiate forecasts back (notebook cell 90-96)

model_ml_global:
  # Third candidate: a single LightGBM model pooling ALL countries' Conso_correction
  # series (via Nixtla's mlforecast), rather than one ML model fit per country on
  # ~100 rows — see train-api/services/trainer_ml.py's module docstring for why.
  enabled: true
  min_countries_required: 2   # below this (e.g. a fresh single-country setup), skip this candidate
  freq: "MS"                  # data is month-start (2019-01-01, ...)
  lags: [1, 2, 3, 6, 12]
  date_features: ["month"]
  static_features: ["country"]
  lightgbm_params:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 4
    num_leaves: 15
    min_child_samples: 5      # LightGBM's default (20) is too strict for ~300-400 pooled training rows
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    verbosity: -1

quality_gate:
  mape_threshold: 10.0       # % — notebook's own acceptability threshold ("MAPE < 10 = très bonne prédiction")
  rmse_relative_threshold: 0.20  # RMSE / mean(actual) must stay below this fraction

mlflow:
  experiment_name: elec_prediction
