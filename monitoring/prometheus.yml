global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'train-api'
    static_configs:
      - targets: ['train-api:5010']

  - job_name: 'predict-api'
    static_configs:
      - targets: ['predict-api:5011']
