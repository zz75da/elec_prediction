groups:
  - name: elec_prediction_service_health
    rules:
      - alert: TrainAPIDown
        expr: up{job="train-api"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "train-api is down"
          description: "train-api has been unreachable for 3 minutes."

      - alert: PredictAPIDown
        expr: up{job="predict-api"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "predict-api is down"
          description: "predict-api has been unreachable for 3 minutes."

  - name: elec_prediction_model_quality
    rules:
      - alert: ModelMapeHigh
        expr: model_mape > 10
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.model }} backtest MAPE above 10% ({{ $labels.country }})"
          description: "{{ $labels.model }} MAPE={{ $value }}% on the held-out test year for country={{ $labels.country }} — above the notebook's own 10% acceptability threshold."

      - alert: ModelTrainingStale
        expr: (time() - train_last_run_timestamp) > 60 * 60 * 24 * 30
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "No retraining for {{ $labels.country }} in over 30 days"
          description: "train_last_run_timestamp for country={{ $labels.country }} is more than 30 days old — model may be stale."

  - name: elec_prediction_traffic
    rules:
      - alert: PredictionLatencyHigh
        expr: histogram_quantile(0.95, rate(predict_request_latency_seconds_bucket[5m])) > 2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "predict-api P95 latency > 2s"
          description: "Forecast requests are slow — check predict-api resource usage."
