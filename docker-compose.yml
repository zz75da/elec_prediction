version: "3.9"

networks:
  elec_prediction_network:
    driver: bridge

services:
  train-api:
    build: ./train-api
    container_name: train-api
    ports:
      - "5010:5010"
    volumes:
      - ./data:/app/data
      - ./params.yaml:/app/params.yaml:ro
    environment:
      - ARTIFACTS_PATH=/app/data/artifacts
      - JOB_DIR=/app/data/jobs
      - PARAMS_PATH=/app/params.yaml
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-}
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME:-}
      - MLFLOW_TRACKING_PASSWORD=${MLFLOW_TRACKING_PASSWORD:-}
    networks:
      - elec_prediction_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5010/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  predict-api:
    build: ./predict-api
    container_name: predict-api
    ports:
      - "5011:5011"
    volumes:
      - ./data:/app/data
    environment:
      - ARTIFACTS_PATH=/app/data/artifacts
    depends_on:
      - train-api
    networks:
      - elec_prediction_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5011/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  streamlit:
    build: ./streamlit
    container_name: streamlit
    ports:
      - "8501:8501"
    environment:
      - TRAIN_API_URL=http://train-api:5010
      - PREDICT_API_URL=http://predict-api:5011
    depends_on:
      - train-api
      - predict-api
    networks:
      - elec_prediction_network

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - train-api
      - predict-api
    networks:
      - elec_prediction_network

  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_storage:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - elec_prediction_network

volumes:
  prometheus_data:
  grafana_storage:
