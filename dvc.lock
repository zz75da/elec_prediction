schema: '2.0'
stages:
  preprocess:
    cmd: python -c " import yaml, sys; sys.path.insert(0, 'train-api'); from 
      services import data_loader, preprocess; p = 
      yaml.safe_load(open('params.yaml')); cfg = 
      p['data']['countries']['france']; df = 
      data_loader.load_merged(cfg['raw_conso_path'], cfg['raw_dju_path'], 
      country='france'); df, ols, stats = preprocess.run_preprocessing(df, 
      seasonal_periods=p['preprocess']['seasonal_periods']); 
      df.to_csv(cfg['processed_path']); print(stats) "
    deps:
    - path: data/raw/france/consommation_mensuelle.csv
      hash: md5
      md5: f8819b9fc01a86fee1e581bd5a1dbd7c
      size: 2526
    - path: data/raw/france/dju_mensuel.csv
      hash: md5
      md5: 190bc199930355b8124c70f842ebe421
      size: 2350
    - path: train-api/services/data_loader.py
      hash: md5
      md5: c16ad4414f65a052c4de6ac2ad4fe553
      size: 1802
